<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ShopEasy Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#6366f1;
  --secondary:#4f46e5;
  --success:#22c55e;
  --danger:#ef4444;
  --warning:#f59e0b;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --shadow:0 10px 30px rgba(0,0,0,.08);
  --radius:22px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:270px;
  height:100vh;
  background:#111827;
  color:white;
  padding:30px;
}

.logo{
  font-size:1.8rem;
  font-weight:700;
  margin-bottom:40px;
}

.sidebar ul{
  list-style:none;
}

.sidebar li{
  margin:15px 0;
}

.sidebar a{
  text-decoration:none;
  color:#d1d5db;
  display:block;
  padding:14px 18px;
  border-radius:14px;
  transition:.3s;
}

.sidebar a:hover,
.sidebar a.active{
  background:rgba(255,255,255,.08);
  color:white;
}

/* MAIN */
.main{
  margin-left:270px;
  padding:40px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.topbar h1{
  font-size:2rem;
}

.admin-badge{
  background:var(--primary);
  color:white;
  padding:12px 18px;
  border-radius:999px;
}

/* CARDS */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  margin-bottom:35px;
}

.card{
  background:var(--card);
  padding:28px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.card h3{
  color:var(--muted);
  margin-bottom:10px;
}

.card h2{
  font-size:2rem;
}

/* FORM */
.form-box{
  background:white;
  padding:30px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin-bottom:35px;
}

.form-box h2{
  margin-bottom:25px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  font-family:inherit;
}

button{
  border:none;
  cursor:pointer;
  font-family:inherit;
}

.btn-primary{
  background:var(--primary);
  color:white;
  padding:14px 20px;
  border-radius:12px;
  transition:.3s;
}

.btn-primary:hover{
  background:var(--secondary);
}

/* TABLE */
.table-box{
  background:white;
  padding:30px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  text-align:left;
  padding:16px;
  background:#f3f4f6;
}

td{
  padding:16px;
  border-bottom:1px solid #eee;
}

.product-img{
  width:60px;
  height:60px;
  border-radius:12px;
  object-fit:cover;
}

.action-buttons{
  display:flex;
  gap:10px;
}

.edit-btn{
  background:var(--warning);
  color:white;
  padding:10px 14px;
  border-radius:10px;
}

.delete-btn{
  background:var(--danger);
  color:white;
  padding:10px 14px;
  border-radius:10px;
}

/* TOAST */
.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  color:white;
  padding:16px 25px;
  border-radius:14px;
  opacity:0;
  transform:translateY(50px);
  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* MOBILE */
@media(max-width:900px){

.sidebar{
  display:none;
}

.main{
  margin-left:0;
  padding:20px;
}

table{
  display:block;
  overflow-x:auto;
}

}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">ShopEasy Admin</div>

  <ul>
    <li><a class="active" href="#">Dashboard</a></li>
    <li><a href="#">Products</a></li>
    <li><a href="#">Orders</a></li>
    <li><a href="#">Customers</a></li>
    <li><a href="#">Settings</a></li>
  </ul>
</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <h1>Dashboard</h1>
    <div class="admin-badge">Admin</div>
  </div>

  <!-- Stats -->
  <div class="stats">

    <div class="card">
      <h3>Total Products</h3>
      <h2 id="totalProducts">0</h2>
    </div>

    <div class="card">
      <h3>Total Orders</h3>
      <h2>124</h2>
    </div>

    <div class="card">
      <h3>Total Revenue</h3>
      <h2>$12,480</h2>
    </div>

  </div>

  <!-- Product Form -->
  <div class="form-box">
    <h2>Add / Edit Product</h2>

    <div class="form-grid">
      <input type="text" id="productName" placeholder="Product Name">

      <input type="number" id="productPrice" placeholder="Price">

      <input type="text" id="productImage" placeholder="Image URL">

      <button class="btn-primary" id="saveBtn">
        Add Product
      </button>
    </div>
  </div>

  <!-- Product Table -->
  <div class="table-box">

    <h2 style="margin-bottom:20px;">
      Products
    </h2>

    <table>
      <thead>
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Price</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="productTable"></tbody>

    </table>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let products = JSON.parse(localStorage.getItem('products')) || [
{
id:1,
name:'Wireless Headphones',
price:59.99,
image:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800'
},
{
id:2,
name:'Gaming Mouse',
price:29.99,
image:'https://images.unsplash.com/photo-1527814050087-3793815479db?w=800'
}
];

const productTable = document.getElementById('productTable');
const totalProducts = document.getElementById('totalProducts');

const productName = document.getElementById('productName');
const productPrice = document.getElementById('productPrice');
const productImage = document.getElementById('productImage');

const saveBtn = document.getElementById('saveBtn');
const toast = document.getElementById('toast');

let editId = null;

function saveStorage(){
localStorage.setItem(
'products',
JSON.stringify(products)
);
}

function showToast(message){
toast.textContent = message;
toast.classList.add('show');

setTimeout(()=>{
toast.classList.remove('show');
},2000);
}

function updateStats(){
totalProducts.textContent = products.length;
}

function renderProducts(){

productTable.innerHTML = "";

products.forEach(product=>{

productTable.innerHTML += `
<tr>

<td>
<img 
src="${product.image}" 
class="product-img">
</td>

<td>${product.name}</td>

<td>$${product.price}</td>

<td>
<div class="action-buttons">

<button 
class="edit-btn"
onclick="editProduct(${product.id})">
Edit
</button>

<button
class="delete-btn"
onclick="deleteProduct(${product.id})">
Delete
</button>

</div>
</td>

</tr>
`;

});

updateStats();
saveStorage();
}

saveBtn.addEventListener('click', ()=>{

const name = productName.value.trim();
const price = productPrice.value.trim();
const image = productImage.value.trim();

if(!name || !price || !image){
showToast('Fill all fields');
return;
}

if(editId){

products = products.map(product=>{

if(product.id === editId){
return {
...product,
name,
price,
image
};
}

return product;

});

showToast('Product updated');

saveBtn.textContent = 'Add Product';
editId = null;

}else{

products.push({
id:Date.now(),
name,
price,
image
});

showToast('Product added');

}

productName.value = "";
productPrice.value = "";
productImage.value = "";

renderProducts();

});

function editProduct(id){

const product = products.find(p=>p.id === id);

productName.value = product.name;
productPrice.value = product.price;
productImage.value = product.image;

editId = id;

saveBtn.textContent = 'Update Product';

window.scrollTo({
top:0,
behavior:'smooth'
});

}

function deleteProduct(id){

products = products.filter(
product => product.id !== id
);

renderProducts();

showToast('Product deleted');

}

renderProducts();
</script>

</body>
</html>
