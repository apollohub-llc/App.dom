<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HireHub Control Panel</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #1a0000, #000);
      font-family: Arial, sans-serif;
      color: white;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 40px;
      color: #ff3b3b;
      letter-spacing: 2px;
    }

    .danger-button {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle, #ff1e1e, #8b0000);
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 40px #ff0000;
      transition: transform 0.1s ease;
    }

    .danger-button:active {
      transform: scale(0.95);
    }

    .status {
      margin-top: 30px;
      color: #888;
      font-size: 14px;
    }

    .warning {
      margin-top: 10px;
      color: #ff4d4d;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SELF DESTRUCT HIREHUB?</h1>

    <button class="danger-button" onclick="selfDestruct()">
      SELF<br>DESTRUCT
    </button>

    <div class="status" id="status">System status: STANDBY</div>
    <div class="warning">This action is irreversible (simulation only)</div>
  </div>

  <script>
    const webhookURL = "https://discord.com/api/webhooks/1499088458407219200/2K55GD94Hb9UDxfsBk-ZVF__9z-Bc2Qv1dg-H94f89pRoU5jq4jNpyyPQ5s7D1z5vyds";

    function selfDestruct() {
      document.getElementById("status").innerText = "System status: TRIGGERED";

      fetch(webhookURL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          content: "🚨 Self Destruct button triggered on HireHub panel."
        })
      }).catch(err => {
        console.log("Webhook failed:", err);
      });
    }
  </script>

</body>
</html>
