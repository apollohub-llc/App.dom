
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueryDeploy</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --surface2: #1a1a24;
            --border: #2a2a3a;
            --accent: #00ff88;
            --accent2: #7c3aed;
            --text: #e8e8f0;
            --muted: #5a5a7a;
            --danger: #ff4466;
            --warn: #ffaa00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 48px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .logo { display: flex; flex-direction: column; gap: 2px; }

        .logo-tag {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--accent);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .logo h1 {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            color: var(--text);
        }

        .logo h1 span { color: var(--accent); }

        .pill {
            font-family: 'Space Mono', monospace;
            font-size: 0.72rem;
            color: var(--muted);
            background: var(--surface2);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 100px;
            white-space: nowrap;
        }

        .editor-block {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .editor-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
        }

        .editor-dots { display: flex; gap: 6px; }
        .editor-dots span { width: 10px; height: 10px; border-radius: 50%; }
        .editor-dots span:nth-child(1) { background: #ff5f57; }
        .editor-dots span:nth-child(2) { background: #ffbd2e; }
        .editor-dots span:nth-child(3) { background: #28c840; }

        .char-info {
            font-family: 'Space Mono', monospace;
            font-size: 0.72rem;
            color: var(--muted);
        }

        .char-info .warn { color: var(--warn); }

        textarea {
            width: 100%;
            min-height: 380px;
            padding: 20px;
            background: transparent;
            color: var(--text);
            border: none;
            outline: none;
            resize: vertical;
            font-family: 'Space Mono', monospace;
            font-size: 0.82rem;
            line-height: 1.7;
        }

        textarea::placeholder { color: var(--muted); }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            padding: 14px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            letter-spacing: 0.02em;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }

        .btn-deploy { background: var(--accent); color: #000; }
        .btn-deploy:hover { box-shadow: 0 0 30px rgba(0,255,136,0.35); }

        .btn-preview {
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-preview:hover { border-color: var(--accent); color: var(--accent); }

        .btn-clear {
            background: var(--surface2);
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 14px 16px;
        }
        .btn-clear:hover { color: var(--danger); border-color: var(--danger); }

        .url-box {
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            display: none;
            animation: fadeUp 0.25s ease;
        }
        .url-box.show { display: block; }

        .url-box-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.68rem;
            color: var(--accent);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .url-row { display: flex; gap: 10px; align-items: stretch; }

        .url-text {
            flex: 1;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--text);
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            word-break: break-all;
            line-height: 1.5;
        }

        .btn-copy {
            background: var(--accent2);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.15s, transform 0.15s;
        }
        .btn-copy:hover { opacity: 0.85; transform: translateY(-1px); }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Space Mono', monospace;
            font-size: 0.78rem;
            padding: 12px 22px;
            border-radius: 100px;
            opacity: 0;
            transition: all 0.25s ease;
            pointer-events: none;
            z-index: 999;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--accent); color: var(--accent); }
        .toast.error { border-color: var(--danger); color: var(--danger); }

        .preview-wrap { display: none; margin-bottom: 20px; }
        .preview-wrap.show { display: block; animation: fadeUp 0.25s ease; }

        .preview-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.68rem;
            color: var(--muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        iframe {
            width: 100%;
            height: 480px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: white;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .logo h1 { font-size: 2.2rem; }
            .actions { grid-template-columns: 1fr 1fr; }
            .btn-clear { grid-column: span 2; }
            .url-row { flex-direction: column; }
        }
    </style>
</head>
<body>

<!-- Viewer script runs before DOM paints -->
<script>
(function () {
    function decode(str) {
        const binary = atob(decodeURIComponent(str));
        const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
        return new TextDecoder().decode(bytes);
    }

    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    if (!code) return;

    try {
        var html = decode(code);

        // Wipe everything on the page
        document.documentElement.innerHTML = '';

        // Reset styles so nothing bleeds through
        var style = document.createElement('style');
        style.textContent = '* { margin:0; padding:0; } html, body { width:100%; height:100%; overflow:hidden; }';
        document.head.appendChild(style);

        // Fullscreen iframe — completely isolated
        var iframe = document.createElement('iframe');
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals');
        iframe.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;border:none;';
        document.body.appendChild(iframe);

        iframe.contentDocument.open();
        iframe.contentDocument.write(html);
        iframe.contentDocument.close();

    } catch (e) {
        document.body.style.cssText = 'font-family:monospace;padding:20px;';
        document.body.innerHTML = '<b style="color:red">Failed to render:</b> ' + e.message;
    }

    // Prevent rest of the page script from running
    throw new Error('__VIEWER__');
})();
</script>

<div class="wrap">
    <header>
        <div class="logo">
            <span class="logo-tag">// url-based hosting</span>
            <h1>Query<span>Deploy</span></h1>
        </div>
        <span class="pill">No server. No database. Just a URL.</span>
    </header>

    <div class="editor-block">
        <div class="editor-topbar">
            <div class="editor-dots"><span></span><span></span><span></span></div>
            <div class="char-info" id="charInfo">0 chars</div>
        </div>
        <textarea id="htmlInput" placeholder="Paste your full HTML here..." spellcheck="false"></textarea>
    </div>

    <div class="actions">
        <button class="btn btn-deploy" id="deployBtn">🚀 Deploy to URL</button>
        <button class="btn btn-preview" id="previewBtn">👁 Preview</button>
        <button class="btn btn-clear" id="clearBtn" title="Clear">✕</button>
    </div>

    <div class="url-box" id="urlBox">
        <div class="url-box-label">▸ Deployed URL</div>
        <div class="url-row">
            <div class="url-text" id="urlText"></div>
            <button class="btn-copy" id="copyBtn">Copy</button>
        </div>
    </div>

    <div class="preview-wrap" id="previewWrap">
        <div class="preview-label">▸ Preview</div>
        <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    function encode(str) {
        var bytes = new TextEncoder().encode(str);
        var binary = '';
        bytes.forEach(function(b) { binary += String.fromCharCode(b); });
        return encodeURIComponent(btoa(binary));
    }

    var htmlInput    = document.getElementById('htmlInput');
    var deployBtn    = document.getElementById('deployBtn');
    var previewBtn   = document.getElementById('previewBtn');
    var clearBtn     = document.getElementById('clearBtn');
    var copyBtn      = document.getElementById('copyBtn');
    var urlBox       = document.getElementById('urlBox');
    var urlText      = document.getElementById('urlText');
    var previewWrap  = document.getElementById('previewWrap');
    var previewFrame = document.getElementById('previewFrame');
    var charInfo     = document.getElementById('charInfo');
    var toast        = document.getElementById('toast');
    var toastTimer;

    function showToast(msg, type) {
        type = type || 'success';
        toast.textContent = msg;
        toast.className = 'toast ' + type + ' show';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 3000);
    }

    function updateCharInfo() {
        var n = htmlInput.value.length;
        charInfo.innerHTML = n > 8000
            ? '<span class="warn">⚠ ' + n.toLocaleString() + ' chars — URL may be very long</span>'
            : n.toLocaleString() + ' chars';
    }

    function renderPreview() {
        var html = htmlInput.value.trim();
        if (!html) { showToast('Nothing to preview.', 'error'); return; }
        var blob = new Blob([html], { type: 'text/html' });
        var url  = URL.createObjectURL(blob);
        previewFrame.onload = function() { URL.revokeObjectURL(url); };
        previewFrame.src = url;
        previewWrap.classList.add('show');
    }

    function deployToURL() {
        var html = htmlInput.value.trim();
        if (!html) { showToast('Paste some HTML first.', 'error'); return; }
        try {
            var encoded = encode(html);
            var u = new URL(window.location.href);
            u.searchParams.set('code', encoded);
            var deployUrl = u.toString();
            urlText.textContent = deployUrl;
            urlBox.classList.add('show');
            window.history.pushState({}, '', deployUrl);
            showToast('Deployed! Share the URL above.');
            renderPreview();
        } catch (err) {
            showToast('Failed: ' + err.message, 'error');
        }
    }

    function copyURL() {
        var url = urlText.textContent;
        if (navigator.clipboard) {
            navigator.clipboard.writeText(url).catch(function() { fallbackCopy(url); });
        } else {
            fallbackCopy(url);
        }
        showToast('URL copied!');
    }

    function fallbackCopy(text) {
        var t = document.createElement('textarea');
        t.value = text;
        document.body.appendChild(t);
        t.select();
        document.execCommand('copy');
        document.body.removeChild(t);
    }

    function clearAll() {
        htmlInput.value = '';
        updateCharInfo();
        previewWrap.classList.remove('show');
        previewFrame.src = 'about:blank';
        urlBox.classList.remove('show');
        var u = new URL(window.location.href);
        u.searchParams.delete('code');
        window.history.pushState({}, '', u);
        showToast('Cleared.');
    }

    htmlInput.addEventListener('input', function() {
        updateCharInfo();
        urlBox.classList.remove('show');
    });

    deployBtn.addEventListener('click', deployToURL);
    previewBtn.addEventListener('click', renderPreview);
    clearBtn.addEventListener('click', clearAll);
    copyBtn.addEventListener('click', copyURL);

    htmlInput.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            deployToURL();
        }
    });

    updateCharInfo();
</script>
</body>
</html>
